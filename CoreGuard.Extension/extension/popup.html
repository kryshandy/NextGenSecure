<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>CoreGuard</title>
<style>
  body { margin: 0; width: 320px; font: 13px/1.45 "Segoe UI", system-ui, sans-serif; color: #15181d; background: #fff; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #e4e7ec; }
  header img { width: 20px; height: 20px; }
  header b { font-size: 14px; }
  main { padding: 12px 14px 14px; }
  .verdict { border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .Safe { background: #e3f4ea; color: #1a7f4b; }
  .Suspicious { background: #fdf0dc; color: #9a5b00; }
  .Phishing { background: #fbe5e8; color: #b42335; }
  .Unknown { background: #f0f2f5; color: #5a6270; }
  .verdict strong { display: block; font-size: 14px; }
  ul { margin: 6px 0 0; padding-left: 18px; }
  .url { color: #5a6270; font-size: 12px; word-break: break-all; margin-bottom: 10px; }
  button { width: 100%; padding: 9px; border: 0; border-radius: 8px; background: #2f5bd9; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { background: #c3cad6; cursor: default; }
  #message { margin-top: 8px; font-size: 12px; color: #5a6270; min-height: 16px; }
  @media (prefers-color-scheme: dark) {
    body { background: #171b21; color: #e8ebf0; } header { border-color: #2a313b; }
    .Safe { background: #12291e; color: #4cc38a; } .Suspicious { background: #2d2311; color: #f0b456; }
    .Phishing { background: #321a1f; color: #ff7a8a; } .Unknown { background: #1e232b; color: #9aa3b2; }
    .url, #message { color: #9aa3b2; }
  }
</style>
</head>
<body>
  <header><img src="icons/icon32.png" alt=""><b>CoreGuard Browser Shield</b></header>
  <main>
    <div id="verdict" class="verdict Unknown"><strong id="titre">Analyse en cours…</strong><ul id="raisons"></ul></div>
    <div id="url" class="url"></div>
    <button id="analyser">Analyser cette page (OCR + IA)</button>
    <button id="remplir" disabled>Remplir l'identifiant enregistré</button>
    <div id="message"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
